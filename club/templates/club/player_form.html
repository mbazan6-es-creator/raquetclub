{% extends 'club/base.html' %}
{% block title %}{{ title }} - ELITE{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-elite-dark text-white">
                <h4 class="mb-0"><i class="bi bi-person-badge"></i> {{ title }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-elite btn-lg">
                            <i class="bi bi-check-circle"></i> Guardar Alumno
                        </button>
                        <a href="{% url 'player_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
