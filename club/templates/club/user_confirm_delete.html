{% extends 'club/base.html' %}
{% block title %}Eliminar Usuario - ELITE{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 text-center p-4">
            <div class="text-danger mb-3 fs-1"><i class="bi bi-exclamation-triangle-fill"></i></div>
            <h4 class="fw-bold">¿Confirmar eliminación?</h4>
            <p class="text-muted">Estás a punto de eliminar la cuenta del usuario: <br><strong class="fs-5 text-dark">{{ target_user.username }}</strong></p>
            <p class="small text-danger">Esta acción no se puede deshacer.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'user_list' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
