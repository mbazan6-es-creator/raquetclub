{% extends 'club/base.html' %}

{% block title %}Asignar Cuota - ELITE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0"><i class="bi bi-calendar-plus"></i> Asignar Mensualidad</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">
                            <i class="bi bi-check-circle"></i> Guardar Mensualidad
                        </button>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
